<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>alphaTab Realtime Editor</title>
    <link rel="icon" type="image/png" href="./favicon.png" />

    <!-- 内联关键 CSS：阻止白屏，在外部 CSS 加载前立即生效 -->
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: linear-gradient(145deg, #050711 0%, #07101d 48%, #03050d 100%);
            color: #f7f2e8;
        }
        /* 主界面初始隐藏，等 JS 初始化完成后渐入 */
        .app-shell { opacity: 0; transition: opacity 0.3s ease; }
        .app-shell.is-ready { opacity: 1; }
        /* Loading Overlay */
        .app-loading {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            background: linear-gradient(145deg, #050711 0%, #07101d 48%, #03050d 100%);
        }
        .app-loading__spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(141,216,255,0.15);
            border-top-color: #8dd8ff;
            border-radius: 50%;
            animation: app-spin 0.8s linear infinite;
        }
        .app-loading__text {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            color: rgba(247,242,232,0.55);
            letter-spacing: 0.04em;
        }
        @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <!-- Loading Overlay：在 JS/CSS 加载期间为用户提供视觉反馈 -->
    <div class="app-loading" id="appLoading">
        <div class="app-loading__spinner"></div>
        <span class="app-loading__text">正在加载编辑器…</span>
    </div>

    <div class="app-shell" id="appShell">
        <div class="app-shell__backdrop" aria-hidden="true"></div>

        <!-- ═══ Topbar：紧凑单行，三组功能分隔 ═══ -->
        <header class="topbar">
            <div class="topbar__brand">
                <h1 class="topbar__title">Realtime Editor</h1>
                <span class="status-pill" id="statusPill" data-tone="muted">等待初始化</span>
            </div>

            <nav class="topbar__actions">
                <!-- 文件操作组 -->
                <div class="toolbar-group">
                    <button class="toolbar-button" id="newDocumentButton" type="button">新建</button>
                    <button class="toolbar-button" id="openFileButton" type="button">打开文件</button>
                    <!-- 示例入口：按需展开 -->
                    <div class="example-trigger">
                        <button class="toolbar-button toolbar-button--ghost" id="exampleButton" type="button" aria-expanded="false" aria-controls="examplePanel">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="vertical-align: -2px; margin-right: 4px;">
                                <path d="M2 3.5h10M2 7h7M2 10.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                            </svg>
                            示例
                        </button>
                        <div class="example-panel" id="examplePanel" role="menu" hidden>
                            <button class="example-panel__item" type="button" role="menuitem" data-example="overture">
                                <strong>♪ 序章动机</strong>
                                <span>分层主旋律与和声示例</span>
                            </button>
                            <button class="example-panel__item" type="button" role="menuitem" data-example="fingerstyle">
                                <strong>♪ 指弹片段</strong>
                                <span>适合试听播放与缩放观察</span>
                            </button>
                            <button class="example-panel__item" type="button" role="menuitem" data-example="swing">
                                <strong>♪ Swing 练习</strong>
                                <span>多小节 Swing 节奏练习</span>
                            </button>
                        </div>
                    </div>
                    <button class="toolbar-button toolbar-button--ghost" id="downloadAlphaTexButton" type="button">导出</button>
                    <button class="toolbar-button toolbar-button--ghost" id="printButton" type="button">打印</button>
                    <input id="fileInput" type="file" hidden accept=".gp,.gp3,.gp4,.gp5,.gpx,.gp7,.gp8,.xml,.musicxml,.mxl,.txt,.alphatex,.atx" />
                </div>

                <span class="toolbar-divider" aria-hidden="true"></span>

                <!-- 视图模式组 -->
                <div class="segmented" aria-label="视图模式">
                    <button class="segmented__button is-active" data-view="split" type="button">拆分</button>
                    <button class="segmented__button" data-view="editor" type="button">仅编辑</button>
                    <button class="segmented__button" data-view="preview" type="button">仅预览</button>
                </div>
            </nav>
        </header>

        <!-- ═══ Workspace ═══ -->
        <main class="workspace" id="workspace" data-view="split">
            <!-- ── 编辑器面板 ── -->
            <section class="panel panel--editor" id="editorPane" aria-label="AlphaTex 编辑器">
                <div class="panel__header">
                    <div>
                        <p class="panel__eyebrow">Script</p>
                        <h2>AlphaTex 编辑器</h2>
                    </div>
                    <div class="panel__meta">
                        <strong id="scoreTitle">未命名工作区</strong>
                        <span id="scoreSubtitle">准备加载 AlphaTex 示例</span>
                    </div>
                </div>

                <!-- 示例预览横幅（默认隐藏） -->
                <div class="example-preview-banner" id="examplePreviewBanner" hidden>
                    <span class="example-preview-banner__icon">ⓘ</span>
                    <span class="example-preview-banner__label" id="examplePreviewLabel">正在预览示例</span>
                    <div class="example-preview-banner__actions">
                        <button class="example-preview-banner__button example-preview-banner__button--restore" id="restoreDocumentButton" type="button">还原到我的文档</button>
                        <button class="example-preview-banner__button example-preview-banner__button--adopt" id="adoptExampleButton" type="button">采用此示例</button>
                    </div>
                </div>

                <div class="editor-surface">
                    <div id="editor"></div>
                </div>

                <!-- 可折叠诊断面板 -->
                <section class="diagnostics-panel" aria-live="polite">
                    <button class="diagnostics-panel__toggle" id="diagnosticsToggle" type="button" aria-expanded="true" data-count="0">
                        <strong>诊断</strong>
                        <span class="diagnostics-panel__badge" id="diagnosticCount">0</span>
                        <svg class="diagnostics-panel__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <path d="M4 5.5L7 8.5L10 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="diagnostics-panel__body">
                        <ul class="diagnostics-list" id="diagnosticsList">
                            <li class="diagnostics-list__empty">初始化完成后会在这里显示错误和警告。</li>
                        </ul>
                    </div>
                </section>
            </section>

            <!-- ── 预览面板 ── -->
            <section class="panel panel--preview" id="previewPane" aria-label="实时预览">
                <div class="panel__header panel__header--preview">
                    <div>
                        <p class="panel__eyebrow">Preview</p>
                        <h2>实时乐谱预览</h2>
                    </div>
                    <span class="panel__hint" id="previewSummary">将保持上次成功渲染结果</span>
                </div>

                <div class="preview-stage">
                    <!-- 可折叠轨道面板 -->
                    <aside class="track-dock">
                        <button class="track-dock__toggle" id="trackDockToggle" type="button" aria-expanded="true">
                            <strong>轨道</strong>
                            <span class="track-dock__badge" id="trackCount">0</span>
                            <svg class="track-dock__chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M4 5.5L7 8.5L10 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                        <div class="track-dock__body">
                            <div class="track-dock__list" id="trackList">
                                <p class="track-dock__empty">等待乐谱加载</p>
                            </div>
                        </div>
                    </aside>

                    <div class="preview-card">
                        <div class="preview-card__overlay" id="previewOverlay" aria-hidden="true">
                            <div class="preview-card__loader"></div>
                            <span>正在渲染预览…</span>
                        </div>

                        <div class="preview-card__scroller" id="previewViewport">
                            <div class="preview-card__sheet" id="alphaTab"></div>
                        </div>
                    </div>
                </div>

                <!-- ═══ Transport — 归属预览面板 ═══ -->
                <footer class="transport">
                    <div class="transport__left">
                        <button class="transport__button transport__button--primary" id="playPauseButton" type="button" disabled>▶ 播放</button>
                        <button class="transport__button" id="stopButton" type="button" disabled>■ 停止</button>
                        <span class="transport__time" id="timeLabel">00:00 / 00:00</span>
                    </div>

                    <div class="transport__center">
                        <div class="timeline" id="timeline" role="slider" aria-label="播放进度" tabindex="0">
                            <div class="timeline__value" id="timelineValue"></div>
                        </div>
                    </div>

                    <div class="transport__right">
                        <label class="toolbar-field toolbar-field--dark">
                            <span>速度</span>
                            <select id="speedSelect">
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1" selected>1x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                            </select>
                        </label>

                        <label class="toolbar-field toolbar-field--dark">
                            <span>缩放</span>
                            <select id="zoomSelect">
                                <option value="75">75%</option>
                                <option value="90">90%</option>
                                <option value="100" selected>100%</option>
                                <option value="125">125%</option>
                                <option value="150">150%</option>
                            </select>
                        </label>

                        <label class="toolbar-field toolbar-field--dark">
                            <span>布局</span>
                            <select id="layoutSelect">
                                <option value="parchment" selected>Parchment</option>
                                <option value="page">Page</option>
                                <option value="horizontal">Horizontal</option>
                            </select>
                        </label>

                        <label class="toolbar-field toolbar-field--dark">
                            <span>滚动</span>
                            <select id="scrollSelect">
                                <option value="continuous" selected>Continuous</option>
                                <option value="off">关闭</option>
                                <option value="offscreen">OffScreen</option>
                                <option value="smooth">Smooth</option>
                            </select>
                        </label>
                    </div>
                </footer>
            </section>
        </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
