# ─── HTTPS 端口（优先） ───────────────────────────────────────
# 自签名证书在 Docker 构建阶段生成，存放于 /etc/nginx/ssl/
# File System Access API 要求 Secure Context，HTTPS 可满足此条件
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        font/woff
        font/woff2
        application/octet-stream;

    # 静态资源缓存（Vite 已对 assets 文件名 hash 化）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体和 SoundFont 资源
    location /font/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 字体 MIME types
        types {
            font/woff2  woff2;
            font/woff   woff;
            font/otf    otf;
            font/ttf    ttf;
            application/font-woff2 woff2;
            application/font-woff woff;
            application/x-font-otf otf;
            application/x-font-ttf ttf;
        }
    }

    # SPA fallback：所有未匹配路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── HTTP 端口（重定向到 HTTPS） ────────────────────────────
# 保留 80 端口用于健康检查和自动重定向
server {
    listen 80;
    server_name _;

    # 健康检查端点（供容器编排探测，不重定向）
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 其余请求 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
