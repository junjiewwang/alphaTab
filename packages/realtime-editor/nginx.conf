server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        font/woff
        font/woff2
        application/octet-stream;

    # 静态资源缓存（Vite 已对 assets 文件名 hash 化）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 字体和 SoundFont 资源
    location /font/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 字体 MIME types
        types {
            font/woff2  woff2;
            font/woff   woff;
            font/otf    otf;
            font/ttf    ttf;
            application/font-woff2 woff2;
            application/font-woff woff;
            application/x-font-otf otf;
            application/x-font-ttf ttf;
        }
    }

    # SPA fallback：所有未匹配路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
